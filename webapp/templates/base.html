<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridWatch 2030</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <strong>GridWatch 2030</strong>
    {% if session.user %}
    <nav>
      <a href="{{ url_for('stations') }}">Stations</a>
      <a href="{{ url_for('meldingen') }}">Meldingen</a>
      <a href="{{ url_for('scenarios') }}">Scenario's</a>
      <span class="user">{{ session.user }} ({{ session.role }}) · <a href="{{ url_for('logout') }}">Uitloggen</a></span>
    </nav>
    {% endif %}
  </header>
  <main>
    {% with msgs = get_flashed_messages() %}
      {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
