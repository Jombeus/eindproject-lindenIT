{% extends "base.html" %}
{% block content %}
<h1>Meldingen</h1>
<form method="post" class="card">
  <h2>Nieuwe melding</h2>
  <label>Station
    <select name="station_id">
      {% for s in stations %}<option value="{{ s.id }}">{{ s.naam }}</option>{% endfor %}
    </select>
  </label>
  <label>Type
    <select name="type"><option>STORING</option><option>ONDERHOUD</option></select>
  </label>
  <label>Beschrijving <textarea name="beschrijving" rows="3" required></textarea></label>
  <button>Opslaan</button>
</form>
<div class="tablewrap">
<table>
  <tr><th>Tijd</th><th>Station</th><th>Type</th><th>Beschrijving</th><th>Door</th></tr>
  {% for a in alerts %}
  <tr><td>{{ a.tijdstip.strftime('%Y-%m-%d %H:%M') }}</td><td>{{ a.naam }}</td>
    <td><span class="badge {{ a.type|lower }}">{{ a.type }}</span></td>
    <td>{{ a.beschrijving }}</td><td>{{ a.ingediend_door }}</td></tr>
  {% endfor %}
</table>
</div>
{% endblock %}
