<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>GridWatch 2030 Testomgeving</title>
<style>
/* Layout: the real app (header + main) on the left, a live app.log terminal on the right; stacks on phones. Colors follow the app's own style.css. */
:root{
  --bg:#f3f5f8; --fg:#1b2430; --muted:#5b6878; --surface:#fff; --line:#e1e6ed; --th:#e8edf3;
  --header:#12304d; --header-fg:#fff; --link:#9fd0ff; --accent:#1565c0; --accent-fg:#fff;
  --flash:#fff3cd; --flash-fg:#5c4400;
  --ok:#c8e6c9; --onderhoud:#ffe0b2; --storing:#ffcdd2; --offline:#cfd8dc; --badge-fg:#1b2430;
  --term:#0f1720; --term-fg:#d6e2f0; --term-dim:#7d8ea3; --lerr:#ff7b7b; --lwarn:#ffd166; --linfo:#8fd3a8;
  --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --fg:#dbe3ec; --muted:#93a1b2; --surface:#16202b; --line:#26323f; --th:#1c2834;
  --header:#0a1f33; --flash:#3a3118; --flash-fg:#f5dfa0;
  --ok:#2e5a33; --onderhoud:#6b4a1c; --storing:#6e2a2f; --offline:#3a4650; --badge-fg:#eef3f8; --accent:#3d8be0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --fg:#dbe3ec; --muted:#93a1b2; --surface:#16202b; --line:#26323f; --th:#1c2834;
  --header:#0a1f33; --flash:#3a3118; --flash-fg:#f5dfa0;
  --ok:#2e5a33; --onderhoud:#6b4a1c; --storing:#6e2a2f; --offline:#3a4650; --badge-fg:#eef3f8; --accent:#3d8be0; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:16px;max-width:1400px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.note{grid-column:1/-1;font-size:13px;color:var(--muted);margin:0}
.browser{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--th);font-family:var(--mono);font-size:12px;color:var(--muted)}
.bar .url{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app{background:var(--bg);min-height:520px}
header{background:var(--header);color:var(--header-fg);padding:12px 24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
nav{display:flex;gap:16px;flex:1;flex-wrap:wrap}
nav a,header a{color:var(--link);text-decoration:none;cursor:pointer}
nav a:focus-visible,header a:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.user{margin-left:auto}
main{max-width:960px;margin:24px auto;padding:0 16px}
h1{font-size:1.6em;margin:0 0 12px;text-wrap:balance} h2{font-size:1.15em;margin:0 0 8px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surface);font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--th)}
.card{background:var(--surface);padding:16px;margin:16px 0;border-radius:8px;box-shadow:0 1px 3px #0002}
.narrow{max-width:360px}
label{display:block;margin:8px 0}
input,select,textarea{display:block;width:100%;padding:6px;box-sizing:border-box;font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:4px}
button{background:var(--accent);color:var(--accent-fg);border:0;padding:8px 16px;border-radius:4px;cursor:pointer;font:inherit}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.danger{background:#b3261e}
.flash{background:var(--flash);color:var(--flash-fg);padding:10px;border-radius:4px;margin-bottom:12px}
.badge{padding:2px 8px;border-radius:10px;font-size:.85em;background:var(--offline);color:var(--badge-fg)}
.ok{background:var(--ok)}.onderhoud{background:var(--onderhoud)}.storing{background:var(--storing)}.offline{background:var(--offline)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
pre.json{background:var(--term);color:var(--term-fg);padding:12px;border-radius:6px;overflow:auto;font-family:var(--mono);font-size:12px;max-height:260px;margin:8px 0 0}
.down{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:520px;gap:8px;text-align:center;padding:24px;color:var(--muted)}
.down strong{font-size:1.3em;color:var(--fg)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.term{background:var(--term);color:var(--term-fg);border-radius:10px;display:flex;flex-direction:column;min-height:300px;max-height:640px;overflow:hidden}
.term .tbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--term-dim);border-bottom:1px solid #ffffff14}
.term .tbar button{background:transparent;color:var(--term-dim);border:1px solid #ffffff2a;padding:2px 8px;font-size:12px}
#log{font-family:var(--mono);font-size:12px;line-height:1.55;padding:10px 12px;overflow:auto;flex:1;white-space:pre-wrap;word-break:break-word;margin:0}
.lerr{color:var(--lerr);font-weight:bold}.lwarn{color:var(--lwarn)}.linfo{color:var(--term-fg)}
.docker{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.docker h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.docker .row button{font-family:var(--mono);font-size:12px;padding:6px 10px}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#3fb950}
.dot.off{background:#b3261e}
code{font-family:var(--mono);font-size:.92em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <p class="note">Test version of the GridWatch 2030 site from step 9, running with sample data in your browser. Log in with <code>admin</code> / <code>Welkom2026!</code>. Every action writes the same line the real <code>app.py</code> writes to <code>logs/app.log</code>.</p>

  <div class="browser">
    <div class="bar"><span>●●●</span><span class="url" id="url">http://localhost:5000/login</span></div>
    <div class="app" id="app"></div>
  </div>

  <div class="side">
    <div class="term">
      <div class="tbar"><span>logs/app.log</span><button id="clearlog" type="button">Wissen</button></div>
      <pre id="log"></pre>
    </div>
    <div class="docker">
      <h2>Terminal (scenario 5)</h2>
      <div class="row">
        <button type="button" id="stopweb">docker stop webapp</button>
        <button type="button" id="startweb" class="ghost">docker start webapp</button>
        <button type="button" id="stopdb" class="ghost">docker stop db</button>
        <button type="button" id="startdb" class="ghost">docker start db</button>
      </div>
      <div class="status" id="cstatus"></div>
    </div>
  </div>
</div>

<script>
(function(){
const IP="172.18.0.1";
const USERS={admin:["Welkom2026!","admin"],operator:["Operator2026!","operator"],viewer:["Viewer2026!","viewer"]};
const stations=[
 {id:1,naam:"Station Arnhem",locatie:"Arnhem",status:"OK"},
 {id:2,naam:"Station Zwolle",locatie:"Zwolle",status:"ONDERHOUD"},
 {id:3,naam:"Station Eemshaven",locatie:"Eemshaven",status:"STORING"},
 {id:4,naam:"Station Utrecht",locatie:"Utrecht",status:"OK"},
 {id:5,naam:"Station Maasvlakte",locatie:"Rotterdam",status:"OFFLINE"}];
let seq=0; const t0=Date.now();
const sensor=[[1,220,34],[2,0,21],[3,95,78],[4,180,31],[5,0,18]].map(([s,v,t])=>({id:++seq,station_id:s,vermogen_mw:v,temperatuur:t,tijdstip:new Date(t0-60000)}));
const alerts=[
 {id:1,station_id:2,type:"ONDERHOUD",beschrijving:"Onderhoud gepland: vervangen schakelmateriaal",ingediend_door:"admin",tijdstip:new Date(t0-120000)},
 {id:2,station_id:3,type:"STORING",beschrijving:"Actieve storing: oververhitting transformator",ingediend_door:"admin",tijdstip:new Date(t0-90000)}];
let session=null, flashes=[], page="login", webUp=true, dbUp=true, busy=false;

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ts=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const short=d=>ts(d).slice(0,16);

function log(level,msg){
  const line=document.createElement("span");
  line.className=level==="ERROR"?"lerr":level==="WARN"?"lwarn":"linfo";
  line.textContent=`${ts(new Date())} ${level} ${msg}\n`;
  const el=$("log"); el.appendChild(line); el.scrollTop=el.scrollHeight;
}
$("clearlog").onclick=()=>{$("log").textContent=""};

function latest(id){let r=null;for(const d of sensor) if(d.station_id===id&&(!r||d.tijdstip>r.tijdstip||(+d.tijdstip===+r.tijdstip&&d.id>r.id)))r=d;return r}
const fmt2=v=>Number(v).toFixed(2), fmt1=v=>Number(v).toFixed(1);

function dbCheck(){ if(!dbUp){ log("ERROR","Database connection failed"); throw new Error("db"); } }

// ---- API (same JSON as app.py) ----
function api(path){
  const start=performance.now(); let status=200, body;
  try{
    dbCheck();
    let m;
    if(path==="/api/stations") body=stations.map(s=>({id:s.id,naam:s.naam,locatie:s.locatie,status:s.status}));
    else if((m=path.match(/^\/api\/station\/(\d+)$/))){
      const s=stations.find(x=>x.id===+m[1]);
      if(!s){status=404;body={error:"station niet gevonden"}}
      else{const d=latest(s.id);body={id:s.id,station:s.naam,locatie:s.locatie,status:s.status,vermogen_mw:d?+d.vermogen_mw:null,temperatuur:d?+d.temperatuur:null,tijdstip:d?d.tijdstip.toISOString().slice(0,19):null}}
    }
    else if(path==="/api/alerts") body=[...alerts].sort((a,b)=>b.tijdstip-a.tijdstip).map(a=>({id:a.id,station:stations.find(s=>s.id===a.station_id).naam,type:a.type,beschrijving:a.beschrijving,tijdstip:a.tijdstip.toISOString().slice(0,19)}));
    else if(path.startsWith("/api/sensor-data")){
      const lim=Math.min(parseInt((path.split("limit=")[1]||"20"))||20,500);
      body=[...sensor].sort((a,b)=>b.tijdstip-a.tijdstip||b.id-a.id).slice(0,lim).map(d=>({station:stations.find(s=>s.id===d.station_id).naam,vermogen_mw:+d.vermogen_mw,temperatuur:+d.temperatuur,tijdstip:d.tijdstip.toISOString().slice(0,19)}));
    }
    else if(path==="/api/grid-health"){
      const on=stations.filter(s=>["OK","ONDERHOUD"].includes(s.status)).length, off=stations.filter(s=>s.status==="OFFLINE").length, st=stations.filter(s=>s.status==="STORING").length;
      body={stations_offline:off,stations_online:on,status:(off||st)?"WAARSCHUWING":"OK",storingen:st};
    }
    else {status=404; body={error:"not found"}; log("WARN",`HTTP 404 on ${path.split("?")[0]} from ${IP}`)}
  }catch(e){status=500;body={error:"interne fout"};log("ERROR",`Unhandled exception on ${path.split("?")[0]}: could not connect to server`)}
  log("INFO",`GET ${path.split("?")[0]} from ${IP} status=${status} ${Math.round(performance.now()-start)}ms`);
  return {status,body};
}

// ---- pages (same HTML as the Jinja templates) ----
function layout(content){
  let nav="";
  if(session) nav=`<nav><a data-go="stations" tabindex="0">Stations</a><a data-go="meldingen" tabindex="0">Meldingen</a><a data-go="scenarios" tabindex="0">Scenario's</a><span class="user">${esc(session.user)} (${esc(session.role)}) · <a data-go="logout" tabindex="0">Uitloggen</a></span></nav>`;
  const fl=flashes.map(m=>`<div class="flash">${esc(m)}</div>`).join(""); flashes=[];
  return `<header><strong>GridWatch 2030</strong>${nav}</header><main>${fl}${content}</main>`;
}
const P={
 login:()=>`<h1>Inloggen</h1><form id="loginform" class="card narrow">
   <label>Gebruikersnaam <input id="username" name="username" required autofocus autocomplete="off"></label>
   <label>Wachtwoord <input id="password" name="password" type="password" required></label>
   <button>Inloggen</button></form>
   <p style="color:var(--muted);font-size:13px">Test accounts: admin / Welkom2026! · operator / Operator2026! · viewer / Viewer2026!</p>`,
 stations:()=>`<h1>Transformatorstations</h1><div class="tablewrap"><table><tr><th>ID</th><th>Naam</th><th>Locatie</th><th>Status</th><th>Vermogen (MW)</th><th>Temperatuur (°C)</th></tr>
   ${stations.map(s=>{const d=latest(s.id);return `<tr><td>${s.id}</td><td>${esc(s.naam)}</td><td>${esc(s.locatie)}</td><td><span class="badge ${s.status.toLowerCase()}">${s.status}</span></td><td>${d?fmt2(d.vermogen_mw):""}</td><td>${d?fmt1(d.temperatuur):""}</td></tr>`}).join("")}</table></div>
   <div class="card"><h2>API testen</h2><div class="row">
   ${["/api/stations","/api/station/1","/api/station/999","/api/alerts","/api/sensor-data?limit=5","/api/grid-health"].map(p=>`<button type="button" class="ghost" data-api="${p}">${p}</button>`).join("")}
   </div><pre class="json" id="apiout" hidden></pre></div>`,
 meldingen:()=>`<h1>Meldingen</h1><form id="meldform" class="card"><h2>Nieuwe melding</h2>
   <label>Station <select id="station_id">${stations.map(s=>`<option value="${s.id}">${esc(s.naam)}</option>`).join("")}</select></label>
   <label>Type <select id="mtype"><option>STORING</option><option>ONDERHOUD</option></select></label>
   <label>Beschrijving <textarea id="beschrijving" rows="3" required></textarea></label>
   <button>Opslaan</button></form>
   <div class="tablewrap"><table><tr><th>Tijd</th><th>Station</th><th>Type</th><th>Beschrijving</th><th>Door</th></tr>
   ${[...alerts].sort((a,b)=>b.tijdstip-a.tijdstip).map(a=>`<tr><td>${short(a.tijdstip)}</td><td>${esc(stations.find(s=>s.id===a.station_id).naam)}</td><td><span class="badge ${a.type.toLowerCase()}">${a.type}</span></td><td>${esc(a.beschrijving)}</td><td>${esc(a.ingediend_door)}</td></tr>`).join("")}</table></div>`,
 scenarios:()=>`<h1>Scenario's</h1><p>Alles wordt gelogd in <code>logs/app.log</code>.</p>
   <div class="card"><h2>Scenario 2 – Meerdere foute wachtwoorden</h2><p style="margin:0 0 8px">Like <code>scenario2_foute_logins.sh</code>: 8 wrong passwords for admin.</p><button type="button" id="brute">Start</button> <span id="brutestatus"></span></div>
   <div class="card"><h2>Scenario 3 – Veel API-verkeer</h2><label>Aantal verzoeken <input id="n" type="number" value="40" min="1" max="500"></label><button type="button" id="flood">Start</button> <span id="floodstatus"></span></div>
   <div class="card"><h2>Scenario 4 – Applicatiefout</h2><button type="button" id="fout">Genereer foutmelding</button></div>
   <div class="card"><h2>Extra – Hoge belasting</h2><button type="button" id="belasting">Genereer 1000 sensorrecords</button> <span id="loadstatus"></span></div>`,
 error:()=>`<h1>Er ging iets mis</h1><p>De fout is gelogd.</p>`
};
const URLS={login:"/login",stations:"/stations",meldingen:"/meldingen",scenarios:"/scenarios",error:"/stations"};

function render(){
  $("url").textContent="http://localhost:5000"+(URLS[page]||"/");
  const app=$("app");
  if(!webUp){app.innerHTML=`<div class="down"><strong>Kan deze site niet bereiken</strong><span>localhost heeft de verbinding geweigerd.</span><code>ERR_CONNECTION_REFUSED</code><span>Run <code>docker start webapp</code> on the right.</span></div>`;return}
  app.innerHTML=layout(P[page]());
  bind();
}
function go(p){
  if(busy) return;
  if(p==="logout"){ if(session) log("INFO",`User ${session.user} logged out`); session=null; p="login"; }
  if(p!=="login"&&!session) p="login";
  if(["stations","meldingen"].includes(p)){ try{dbCheck()}catch(e){ log("ERROR",`Unhandled exception on /${p}: could not connect to server`); page="error"; render(); return; } }
  page=p; render();
}
function tryLogin(u,pw){
  try{dbCheck()}catch(e){log("ERROR","Unhandled exception on /login: could not connect to server");return "error"}
  const rec=USERS[u];
  if(rec&&rec[0]===pw){ log("INFO",`User ${u} logged in from ${IP}`); return {user:u,role:rec[1]}; }
  log("WARN",`Invalid password for user ${u} from ${IP}`); return null;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function bind(){
  document.querySelectorAll("[data-go]").forEach(a=>{a.onclick=()=>go(a.dataset.go);a.onkeydown=e=>{if(e.key==="Enter")go(a.dataset.go)}});
  const lf=$("loginform");
  if(lf){ lf.onsubmit=e=>{e.preventDefault(); const r=tryLogin($("username").value,$("password").value);
    if(r==="error"){page="error";render()} else if(r){session=r;go("stations")} else {flashes.push("Ongeldige gebruikersnaam of wachtwoord.");render()} }; $("username").focus(); }
  document.querySelectorAll("[data-api]").forEach(b=>b.onclick=()=>{const r=api(b.dataset.api);const o=$("apiout");o.hidden=false;o.textContent=`HTTP ${r.status}\n`+JSON.stringify(r.body,null,2)});
  const mf=$("meldform");
  if(mf) mf.onsubmit=e=>{e.preventDefault(); const sid=+$("station_id").value, ty=$("mtype").value, b=$("beschrijving").value.trim();
    if(!b){flashes.push("Vul een beschrijving in.");render();return}
    try{dbCheck()}catch(x){log("ERROR","Unhandled exception on /meldingen: could not connect to server");page="error";render();return}
    alerts.push({id:alerts.length+1,station_id:sid,type:ty,beschrijving:b,ingediend_door:session.user,tijdstip:new Date()});
    log("INFO",`New ${ty} report by ${session.user} for station ${sid}`); flashes.push("Melding opgeslagen."); render(); };
  if($("fout")) $("fout").onclick=()=>{log("ERROR",`Test exception generated by ${session.user}`);flashes.push("Er is een testfout gelogd (ERROR).");render()};
  if($("flood")) $("flood").onclick=async()=>{const n=Math.max(1,Math.min(500,parseInt($("n").value)||40)),o=$("floodstatus");busy=true;
    for(let i=1;i<=n;i++){ if(!webUp){o.textContent=`gestopt bij ${i-1}/${n}`;break} api("/api/stations"); o.textContent=i+"/"+n; await wait(25); } if(webUp)o.textContent+=" klaar"; busy=false;};
  if($("brute")) $("brute").onclick=async()=>{const o=$("brutestatus");busy=true;const pws=["welkom123","test123","admin123","password","qwerty","123456","letmein","admin"];
    for(let i=0;i<pws.length;i++){ if(!webUp)break; tryLogin("admin",pws[i]); o.textContent=`${i+1}/${pws.length}`; await wait(300);} o.textContent+=" klaar";busy=false;};
  if($("belasting")) $("belasting").onclick=async()=>{
    try{dbCheck()}catch(x){log("ERROR","Unhandled exception on /scenarios/belasting: could not connect to server");page="error";render();return}
    busy=true;const o=$("loadstatus"),aantal=1000,start=performance.now();
    log("INFO",`Generating ${aantal} sensor records (requested by ${session.user})`);
    for(let i=0;i<aantal;i++){ sensor.push({id:++seq,station_id:1+Math.floor(Math.random()*5),vermogen_mw:+(Math.random()*400).toFixed(2),temperatuur:+(15+Math.random()*80).toFixed(1),tijdstip:new Date()});
      if((i+1)%250===0){log("INFO",`Generated ${i+1}/${aantal} sensor records`);o.textContent=`${i+1}/${aantal}`;await wait(350)} }
    log("INFO",`Finished generating ${aantal} sensor records in ${((performance.now()-start)/1000).toFixed(1)}s`);
    busy=false; flashes.push(`${aantal} sensorrecords gegenereerd.`); render(); };
}

function cstatus(){$("cstatus").innerHTML=`<span class="dot${webUp?"":" off"}"></span>webapp ${webUp?"running":"exited"} &nbsp; <span class="dot${dbUp?"":" off"}"></span>db ${dbUp?"healthy":"exited"}`}
$("stopweb").onclick=()=>{ if(!webUp)return; log("INFO","Application stopped (signal 15)"); webUp=false; busy=false; cstatus(); render(); };
$("startweb").onclick=()=>{ if(webUp)return; webUp=true; if(!dbUp){log("ERROR","Database connection failed (attempt 1/10)")} log("INFO","Application started"); session=null; page="login"; cstatus(); render(); };
$("stopdb").onclick=()=>{ dbUp=false; cstatus(); };
$("startdb").onclick=()=>{ dbUp=true; cstatus(); };

log("INFO","Seeded default users"); log("INFO","Application started");
cstatus(); render();
})();
</script>
</body>
</html>
